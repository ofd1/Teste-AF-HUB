<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15161d"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d8ceb" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#3fa0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fd0ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="mf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd8e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#2d8ceb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2d8ceb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- carro esportivo (silhueta lateral), atrás das letras -->
  <g transform="translate(0 20)">
    <path d="M46 352 L48 336 C50 324 62 318 86 315 L168 306 C204 284 240 270 280 270 C322 270 350 282 378 300 L424 310 C450 314 466 322 470 336 L470 348 C470 355 464 358 456 358 L46 358 Z" fill="url(#car)"/>
    <path d="M190 304 C218 286 246 277 278 277 C308 277 330 286 352 298 L340 302 L196 306 Z" fill="url(#glass)"/>
    <line x1="46" y1="358" x2="470" y2="358" stroke="#8fd0ff" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="140" cy="358" r="31" fill="#07070b"/>
    <circle cx="140" cy="358" r="21" fill="none" stroke="#8fd0ff" stroke-opacity="0.75" stroke-width="5"/>
    <circle cx="386" cy="358" r="31" fill="#07070b"/>
    <circle cx="386" cy="358" r="21" fill="none" stroke="#8fd0ff" stroke-opacity="0.85" stroke-width="5"/>
    <!-- rastro de velocidade -->
    <path d="M18 330 H70 M30 344 H62" stroke="#8fd0ff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <path d="M452 322 h14" stroke="#ffffff" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- MF -->
  <text x="256" y="300" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="196" letter-spacing="-10" fill="url(#mf)">MF</text>
</svg>
