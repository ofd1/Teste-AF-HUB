<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d14">
  <title>MotionFrame Editor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand"><span class="logo">◆</span> MotionFrame</div>
      <div class="tb-group">
        <button data-cmd="new" title="Novo projeto">Novo</button>
        <button data-cmd="open" title="Abrir projeto (.json)">Abrir</button>
        <button data-cmd="save" title="Salvar projeto (Ctrl+S)">Salvar</button>
      </div>
      <div class="tb-group">
        <button data-cmd="undo" title="Desfazer (Ctrl+Z)">↶</button>
        <button data-cmd="redo" title="Refazer (Ctrl+Shift+Z)">↷</button>
      </div>
      <div class="tb-group add">
        <button data-cmd="add-text" title="Adicionar texto">＋ Texto</button>
        <button data-cmd="add-rect" title="Adicionar retângulo">▭</button>
        <button data-cmd="add-ellipse" title="Adicionar elipse">◯</button>
        <button data-cmd="add-solid" title="Adicionar sólido">■</button>
        <button data-cmd="add-media" title="Importar imagem ou vídeo">＋ Mídia</button>
      </div>
      <div class="tb-group">
        <button data-cmd="import-ffx" class="accent" title="Importar preset do After Effects">⤒ .ffx</button>
        <button data-cmd="comp" title="Configurações da composição">⚙ Comp</button>
        <button data-cmd="export" class="primary" title="Exportar">Exportar</button>
      </div>
    </header>

    <main class="stage-area">
      <div class="stage" id="stage">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="view"></canvas>
          <canvas id="overlay"></canvas>
        </div>
      </div>
      <div class="transport">
        <button data-cmd="start" title="Início (Home)">⏮</button>
        <button data-cmd="prev-frame" title="Quadro anterior (←)">‹</button>
        <button data-cmd="play" class="play" title="Reproduzir (Espaço)">▶</button>
        <button data-cmd="next-frame" title="Próximo quadro (→)">›</button>
        <button data-cmd="end" title="Fim (End)">⏭</button>
        <span class="tc" id="timecode">00:00:00</span>
        <label class="loop"><input type="checkbox" id="loop" checked> loop</label>
        <span class="spacer"></span>
        <select id="quality" title="Qualidade da prévia"><option value="1">Prévia 100%</option><option value="0.5" selected>Prévia 50%</option><option value="0.25">Prévia 25%</option></select>
        <span class="layer-tools">
          <button data-cmd="dup" title="Duplicar camada (Ctrl+D)">⧉</button>
          <button data-cmd="up" title="Subir camada">▲</button>
          <button data-cmd="down" title="Descer camada">▼</button>
          <button data-cmd="del" title="Excluir camada (Del)" class="danger">🗑</button>
        </span>
        <span class="zoom"><button data-cmd="zoom-out" title="Afastar timeline">−</button><button data-cmd="zoom-in" title="Aproximar timeline">＋</button></span>
      </div>
    </main>

    <nav class="tabs">
      <button data-tab="timeline" class="mobile-only">Timeline</button>
      <button data-tab="props" class="active">Propriedades</button>
      <button data-tab="presets">Presets</button>
    </nav>
    <aside class="pane pane-props active" data-pane="props"><div id="inspector"></div></aside>
    <aside class="pane pane-presets" data-pane="presets"><div id="library"></div></aside>
    <section class="pane pane-timeline" data-pane="timeline"><div id="timeline" class="timeline"></div></section>

    <div class="drop-overlay" id="dropOverlay"><div>Solte arquivos .ffx, presets .json, imagens ou vídeos</div></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
