<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo Oculto</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<style>
  :root {
    --bg: #0f2a1d; --bg2: #163b29; --card: #fffaf0; --ink: #2b1d14; --muted: #7a6a5c;
    --red: #c8102e; --red2: #9e0c24; --gold: #f2c14e; --green: #1f7a4d; --paper: #fdf6e3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
    background: radial-gradient(circle at 20% 10%, var(--bg2), var(--bg) 60%) fixed; min-height: 100vh;
  }
  /* neve */
  .neve { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .neve i { position: absolute; top: -10px; color: #fff; opacity: .7; animation: cair linear infinite; }
  @keyframes cair { to { transform: translateY(110vh) rotate(360deg); } }

  main { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { color: #fff; text-align: center; font-size: 2rem; margin: 8px 0 4px; letter-spacing: .5px; }
  h1 span { color: var(--gold); }
  .sub { color: #cfe3d6; text-align: center; margin: 0 0 24px; }
  .card { background: var(--card); border-radius: 18px; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .card h2 { margin: 0 0 12px; font-size: 1.25rem; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; }
  .btn { background: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red2); transition: transform .1s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.sec { background: #e9dfcc; color: var(--ink); box-shadow: 0 4px 0 #cbbda3; }
  .btn.grande { font-size: 1.2rem; padding: 16px 28px; }
  input { font: inherit; width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #e2d6bf; background: #fff; color: var(--ink); }
  input:focus { outline: none; border-color: var(--green); }
  .erro { color: var(--red); min-height: 1.3em; margin: 10px 0 0; font-weight: 600; }
  .ok { color: var(--green); min-height: 1.3em; margin: 10px 0 0; font-weight: 600; }

  /* login */
  .nomes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .nomes button { background: #fff; border: 2px solid #e2d6bf; color: var(--ink); padding: 14px 6px; }
  .nomes button.sel { border-color: var(--red); background: #fde8ea; }
  .nomes button small { display: block; font-weight: 400; color: var(--muted); font-size: .72rem; margin-top: 2px; }
  .senha { margin-top: 16px; display: none; gap: 10px; }
  .senha.on { display: flex; }

  /* nav */
  nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  nav a { text-decoration: none; color: #fff; padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,.1); font-weight: 600; }
  nav a.on { background: var(--gold); color: var(--ink); }
  .ola { color: #cfe3d6; text-align: center; margin-bottom: 10px; }

  /* desejos */
  .item { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px; border: 2px dashed #e2d6bf; border-radius: 12px; margin-bottom: 10px; }
  .item .campos { display: grid; gap: 8px; }
  .item .rm { background: transparent; color: var(--red); padding: 6px 10px; align-self: start; font-size: 1.2rem; }
  .acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

  /* sorteio */
  .palco { position: relative; height: 330px; display: flex; align-items: flex-end; justify-content: center; }
  .pote { position: relative; width: 240px; height: 170px; }
  .pote .boca { position: absolute; top: 0; left: 0; right: 0; height: 40px; border-radius: 50%; background: #4a2c17; border: 6px solid var(--red2); z-index: 1; }
  .pote .corpo { position: absolute; top: 20px; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, var(--red2), var(--red) 40%, var(--red2)); border-radius: 0 0 100px 100px / 0 0 80px 80px; z-index: 3; overflow: hidden; }
  .pote .corpo::after { content: "🎄 AMIGO OCULTO 🎄"; position: absolute; top: 50%; left: 0; right: 0; text-align: center; color: var(--gold); font-weight: 800; font-size: .85rem; letter-spacing: 1px; }
  .papel { position: absolute; width: 46px; height: 30px; background: var(--paper); border: 1px solid #d9cba8; border-radius: 3px; z-index: 2; box-shadow: 0 2px 3px rgba(0,0,0,.2); }
  .papel::before { content: ""; position: absolute; inset: 0; border-top: 1px solid #e5d8b8; top: 50%; }
  .mexendo .papel { animation: chacoalha .25s ease-in-out infinite alternate; }
  .mexendo .pote { animation: pote .18s ease-in-out infinite alternate; }
  @keyframes chacoalha { from { transform: translate(-6px, 4px) rotate(var(--r)); } to { transform: translate(6px, -10px) rotate(calc(var(--r) * -1)); } }
  @keyframes pote { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

  .bilhete { position: absolute; left: 50%; bottom: 120px; width: 70px; height: 44px; transform: translateX(-50%) scale(.6); opacity: 0; z-index: 4; perspective: 800px; }
  .bilhete.sobe { animation: sobe 1s cubic-bezier(.2,.8,.2,1) forwards; }
  .bilhete.aberto, .bilhete.fixo { opacity: 1; width: 280px; height: 170px; bottom: 150px; transform: translateX(-50%) scale(1); transition: width .6s ease, height .6s ease, bottom .6s ease; }
  .bilhete.fixo { transition: none; }
  @keyframes sobe { 0% { opacity: 1; bottom: 120px; transform: translateX(-50%) scale(.6) rotate(0); } 100% { opacity: 1; bottom: 210px; transform: translateX(-50%) scale(1) rotate(720deg); } }
  .bilhete .folha { position: absolute; inset: 0; background: var(--paper); border-radius: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.4); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px;
    background-image: repeating-linear-gradient(transparent 0 27px, #e9dcbc 27px 28px); }
  .bilhete .aba { position: absolute; left: 0; right: 0; top: 0; height: 50%; background: #f3e8cc; transform-origin: bottom; border-radius: 6px 6px 0 0; border-bottom: 1px solid #d9cba8; z-index: 2; transition: transform .7s ease .1s; }
  .bilhete.aberto .aba, .bilhete.fixo .aba { transform: rotateX(180deg); opacity: 0; transition: transform .7s ease .1s, opacity .1s linear .6s; }
  .bilhete .rot { font-size: .85rem; color: var(--muted); opacity: 0; transition: opacity .4s .6s; }
  .bilhete .nome { font-family: "Segoe Script", "Brush Script MT", cursive; font-size: 2.3rem; color: var(--red); font-weight: 700; opacity: 0; transition: opacity .4s .7s; }
  .bilhete.aberto .rot, .bilhete.aberto .nome, .bilhete.fixo .rot, .bilhete.fixo .nome { opacity: 1; }
  .bilhete.fixo .rot, .bilhete.fixo .nome { transition: none; }

  .lista-amigo { margin-top: 16px; }
  .lista-amigo ul { list-style: none; padding: 0; margin: 0; }
  .lista-amigo li { padding: 12px; border-radius: 12px; background: #fff; border: 2px solid #efe4cf; margin-bottom: 8px; }
  .lista-amigo li a { display: inline-block; margin-top: 6px; color: #fff; background: var(--green); padding: 6px 12px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: .9rem; word-break: break-all; }
  .vazio { color: var(--muted); font-style: italic; }
  .centro { text-align: center; }

  /* presente no canto */
  .presente { position: fixed; right: 18px; bottom: 18px; z-index: 20; display: none; align-items: center; gap: 8px; background: var(--card); padding: 8px 14px 8px 8px; border-radius: 999px; box-shadow: 0 8px 20px rgba(0,0,0,.4); color: var(--ink); font-weight: 700; }
  .presente.on { display: flex; }
  .presente .ico { font-size: 2rem; animation: pula 1.4s ease-in-out infinite; }
  @keyframes pula { 0%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-8px) rotate(-10deg); } 60% { transform: translateY(0) rotate(8deg); } }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 30; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal.on { display: flex; }
  .modal .card { width: 100%; max-width: 480px; max-height: 85vh; overflow: auto; }

  .confete { position: fixed; top: -12px; width: 10px; height: 14px; z-index: 50; pointer-events: none; animation: confete 2.6s ease-in forwards; }
  @keyframes confete { to { transform: translateY(110vh) rotate(900deg); opacity: .8; } }

  @media (max-width: 420px) { .nomes { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 1.6rem; } }
  @media (prefers-reduced-motion: reduce) { .neve, .presente .ico { animation: none; } }
</style>
</head>
<body>
<div class="neve" id="neve"></div>
<main id="app"></main>

<button class="presente" id="presente" aria-label="Ver lista de desejo">
  <span class="ico">🎁</span><span>Ver lista de desejo</span>
</button>
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkSeguro = (u) => /^https?:\/\//i.test(u || '') ? u : '';

let token = null;
try { token = localStorage.getItem('ao_token'); } catch {}
let eu = null;

async function api(metodo, rota, corpo) {
  const r = await fetch(rota, {
    method: metodo,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(dados.erro || 'Erro'), { status: r.status });
  return dados;
}

// neve
for (let i = 0; i < 30; i++) {
  const f = document.createElement('i');
  f.textContent = '❄';
  f.style.left = Math.random() * 100 + 'vw';
  f.style.fontSize = 8 + Math.random() * 14 + 'px';
  f.style.animationDuration = 6 + Math.random() * 10 + 's';
  f.style.animationDelay = -Math.random() * 16 + 's';
  $('#neve').appendChild(f);
}

function cabecalho() {
  return `<h1>🎅 Amigo <span>Oculto</span> 🎄</h1>`;
}

// ---------- roteamento ----------
function ir(rota) { history.pushState({}, '', rota); render(); }
window.addEventListener('popstate', render);
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-link]');
  if (a) { e.preventDefault(); ir(a.getAttribute('href')); }
});

async function iniciar() {
  if (token) {
    try { eu = await api('GET', '/api/eu'); }
    catch (e) { if (e.status === 401) { token = null; try { localStorage.removeItem('ao_token'); } catch {} } }
  }
  render();
}

function render() {
  if (!eu) return telaLogin();
  if (location.pathname === '/' ) history.replaceState({}, '', eu.sorteou ? '/sorteio' : '/desejos');
  const rota = location.pathname.startsWith('/sorteio') ? 'sorteio' : 'desejos';
  const nav = `
    <p class="ola">Olá, <b>${esc(eu.nome)}</b>! 👋</p>
    <nav>
      <a href="/desejos" data-link class="${rota === 'desejos' ? 'on' : ''}">📝 Minha lista de desejos</a>
      <a href="/sorteio" data-link class="${rota === 'sorteio' ? 'on' : ''}">🎩 Sortear nome</a>
    </nav>`;
  app.innerHTML = cabecalho() + nav + '<div id="tela"></div>';
  rota === 'sorteio' ? telaSorteio() : telaDesejos();
  $('#presente').classList.toggle('on', !!eu.sorteou);
}

// ---------- login ----------
async function telaLogin() {
  $('#presente').classList.remove('on');
  app.innerHTML = cabecalho() + `<p class="sub">Sorteio de Natal da galera</p>
    <div class="card">
      <h2>Quem é você?</h2>
      <div class="nomes" id="nomes">Carregando…</div>
      <form class="senha" id="formSenha">
        <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" required>
        <button class="btn" type="submit">Entrar</button>
      </form>
      <p class="erro" id="erro"></p>
    </div>`;
  let escolhido = null;
  try {
    const lista = await api('GET', '/api/participantes');
    $('#nomes').innerHTML = lista.map((p) =>
      `<button type="button" data-nome="${esc(p.nome)}">${esc(p.nome)}${p.emUso ? '<small>🔒 já entrou</small>' : ''}</button>`).join('');
  } catch { $('#nomes').textContent = 'Não foi possível carregar.'; }
  $('#nomes').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    escolhido = b.dataset.nome;
    document.querySelectorAll('#nomes button').forEach((x) => x.classList.toggle('sel', x === b));
    $('#formSenha').classList.add('on'); $('#erro').textContent = ''; $('#senha').focus();
  });
  $('#formSenha').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const r = await api('POST', '/api/login', { nome: escolhido, senha: $('#senha').value });
      token = r.token; try { localStorage.setItem('ao_token', token); } catch {}
      delete r.token; eu = r;
      history.replaceState({}, '', eu.sorteou ? '/sorteio' : '/desejos');
      render();
    } catch (err) { $('#erro').textContent = err.message; }
  });
}

// ---------- lista de desejos ----------
function telaDesejos() {
  const tela = $('#tela');
  const itens = eu.desejos.length ? eu.desejos.map((d) => ({ ...d })) : [{ item: '', link: '' }];
  const desenhar = () => {
    tela.innerHTML = `<div class="card">
      <h2>📝 Minha lista de desejos</h2>
      <p class="vazio" style="margin-top:-4px">Quem te tirar vai ver isso junto com o seu nome.</p>
      <div id="itens">${itens.map((d, i) => `
        <div class="item">
          <div class="campos">
            <input data-i="${i}" data-k="item" placeholder="O que você quer? (ex.: camisa do time, tam. M)" value="${esc(d.item)}" maxlength="200">
            <input data-i="${i}" data-k="link" placeholder="Link de compra (opcional)" value="${esc(d.link)}" inputmode="url">
          </div>
          <button class="rm" data-rm="${i}" title="Remover">✕</button>
        </div>`).join('')}
      </div>
      <div class="acoes">
        <button class="btn sec" id="add">+ Adicionar desejo</button>
        <button class="btn" id="salvar">Salvar lista</button>
      </div>
      <p class="ok" id="msg"></p>
    </div>`;
  };
  desenhar();
  tela.addEventListener('input', (e) => { const el = e.target; if (el.dataset.k) itens[el.dataset.i][el.dataset.k] = el.value; });
  tela.addEventListener('click', async (e) => {
    if (e.target.id === 'add') { if (itens.length < 20) itens.push({ item: '', link: '' }); desenhar(); }
    else if (e.target.dataset.rm !== undefined) { itens.splice(+e.target.dataset.rm, 1); if (!itens.length) itens.push({ item: '', link: '' }); desenhar(); }
    else if (e.target.id === 'salvar') {
      try {
        eu = await api('PUT', '/api/desejos', { desejos: itens });
        itens.length = 0; (eu.desejos.length ? eu.desejos : [{ item: '', link: '' }]).forEach((d) => itens.push({ ...d }));
        desenhar(); $('#msg').textContent = '✅ Lista salva! Agora é só ir em "Sortear nome".';
      } catch (err) { $('#msg').textContent = err.message; }
    }
  });
}

// ---------- sorteio ----------
function htmlLista(amigo) {
  if (!amigo.desejos.length) return `<p class="vazio">${esc(amigo.nome)} ainda não preencheu a lista de desejos. Volte depois! 👀</p>`;
  return `<ul>${amigo.desejos.map((d) => {
    const l = linkSeguro(d.link);
    return `<li>🎁 ${esc(d.item) || '<span class="vazio">(sem descrição)</span>'}${l ? `<br><a href="${esc(l)}" target="_blank" rel="noopener noreferrer">🛒 Link de compra</a>` : ''}</li>`;
  }).join('')}</ul>`;
}

function telaSorteio() {
  const tela = $('#tela');
  const papeis = Array.from({ length: 9 }, (_, i) =>
    `<div class="papel" style="left:${20 + (i % 5) * 38}px; top:${4 + Math.floor(i / 5) * 12 + (i % 2) * 6}px; --r:${(i * 37) % 50 - 25}deg; transform: rotate(${(i * 37) % 50 - 25}deg); animation-delay:${i * 0.03}s"></div>`).join('');
  tela.innerHTML = `<div class="card">
    <div class="palco" id="palco">
      <div class="bilhete ${eu.sorteou ? 'fixo' : ''}" id="bilhete">
        <div class="folha"><div class="rot">Você tirou</div><div class="nome">${eu.sorteou ? esc(eu.amigo.nome) : ''}</div></div>
        <div class="aba"></div>
      </div>
      <div class="pote">${papeis}<div class="boca"></div><div class="corpo"></div></div>
    </div>
    <div class="centro" id="acao">${eu.sorteou ? '' : '<button class="btn grande" id="sortear">🎩 Sortear meu amigo oculto</button>'}</div>
    <div class="lista-amigo" id="listaAmigo">${eu.sorteou ? `<h2>Lista de desejos de ${esc(eu.amigo.nome)}</h2>` + htmlLista(eu.amigo) : ''}</div>
  </div>`;

  const b = $('#sortear');
  if (b) b.addEventListener('click', async () => {
    b.disabled = true; b.textContent = 'Sorteando…';
    let r;
    try { r = await api('POST', '/api/sortear'); }
    catch (err) { b.disabled = false; b.textContent = '🎩 Sortear meu amigo oculto'; alert(err.message); return; }
    const palco = $('#palco'), bil = $('#bilhete');
    palco.classList.add('mexendo');
    await esperar(2200);
    palco.classList.remove('mexendo');
    $('.nome', bil).textContent = r.amigo.nome;
    bil.classList.add('sobe');
    await esperar(1000);
    bil.classList.remove('sobe'); bil.classList.add('aberto');
    await esperar(900);
    confete();
    eu = r;
    $('#acao').innerHTML = '';
    $('#listaAmigo').innerHTML = `<h2>Lista de desejos de ${esc(eu.amigo.nome)}</h2>` + htmlLista(eu.amigo);
    $('#presente').classList.add('on');
  });
}

const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

function confete() {
  const cores = ['#c8102e', '#f2c14e', '#1f7a4d', '#ffffff', '#4aa3ff'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confete';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cores[i % cores.length];
    c.style.animationDelay = Math.random() * 0.6 + 's';
    c.style.animationDuration = 2 + Math.random() * 1.5 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

// ---------- presente no canto ----------
$('#presente').addEventListener('click', async () => {
  try { eu = await api('GET', '/api/eu'); } catch {}
  if (!eu || !eu.sorteou) return;
  $('#modalCard').innerHTML = `<h2>🎁 Lista de desejos de ${esc(eu.amigo.nome)}</h2>
    <div class="lista-amigo">${htmlLista(eu.amigo)}</div>
    <div class="centro" style="margin-top:12px"><button class="btn" id="fechar">Fechar</button></div>`;
  $('#modal').classList.add('on');
});
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal' || e.target.id === 'fechar') $('#modal').classList.remove('on'); });

iniciar();
</script>
</body>
</html>
