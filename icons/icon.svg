<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/><stop offset="0.55" stop-color="#0c0820"/><stop offset="1" stop-color="#05040c"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.62" cy="0.36" r="0.6">
      <stop offset="0" stop-color="#ff3d8b" stop-opacity="0.55"/><stop offset="0.45" stop-color="#7b2ff7" stop-opacity="0.25"/><stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.38" stop-color="#ffe3f0"/><stop offset="0.62" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ff2d75"/>
    </linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a1fd1"/><stop offset="1" stop-color="#22093f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset="0.35" stop-color="#00e5ff"/><stop offset="0.7" stop-color="#b14dff"/><stop offset="1" stop-color="#ff2d75"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#140a2e" stop-opacity="0"/><stop offset="0.4" stop-color="#1d0f45"/><stop offset="1" stop-color="#2a1260"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="streak2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d75" stop-opacity="0"/><stop offset="1" stop-color="#ff7ab0" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
