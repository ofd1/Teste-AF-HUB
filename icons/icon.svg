138 87,138 44,76 44,170" fill="url(#ext)"/><polygon points="222,170 222,0 366,0 358,40 268,40 268,66 346,66 340,104 268,104 268,170" fill="url(#ext)"/></g><g transform="translate(6.4 7.6)"><polygon points="0,170 0,0 50,0 100,74 150,0 200,0 200,170 156,170 156,76 113,138 87,138 44,76 44,170" fill="url(#ext)"/><polygon points="222,170 222,0 366,0 358,40 268,40 268,66 346,66 340,104 268,104 268,170" fill="url(#ext)"/></g><g transform="translate(4.8 5.7)"><polygon points="0,170 0,0 50,0 100,74 150,0 200,0 200,170 156,170 156,76 113,138 87,138 44,76 44,170" fill="url(#ext)"/><polygon points="222,170 222,0 366,0 358,40 268,40 268,66 346,66 340,104 268,104 268,170" fill="url(#ext)"/></g><g transform="translate(3.2 3.8)"><polygon points="0,170 0,0 50,0 100,74 150,0 200,0 200,170 156,170 156,76 113,138 87,138 44,76 44,170" fill="url(#ext)"/><polygon points="222,170 222,0 366,0 358,40 268,40 268,66 346,66 340,104 268,104 268,170" fill="url(#ext)"/></g><g transform="translate(1.6 1.9)"><polygon points="0,170 0,0 50,0 100,74 150,0 200,0 200,170 156,170 156,76 113,138 87,138 44,76 44,170" fill="url(#ext)"/><polygon points="222,170 222,0 366,0 358,40 268,40 268,66 346,66 340,104 268,104 268,170" fill="url(#ext)"/></g>
