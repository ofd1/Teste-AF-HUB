      <path d="M46 352 L48 336 C50 324 62 318 86 315 L168 306 C204 284 240 270 280 270 C322 270 350 282 378 300 L424 310 C450 314 466 322 470 336 L470 348 C470 355 464 358 456 358 L46 358 Z" fill="url(#body)"/>
