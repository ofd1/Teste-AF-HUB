      <line x1="30" y1="322" x2="120" y2="322" stroke="url(#streak2)" stroke-width="3"/>
      <line x1="0" y1="392" x2="110" y2="392" stroke="url(#streak)" stroke-width="3"/>
      <line x1="300" y1="78" x2="470" y2="78" stroke="url(#streak2)" stroke-width="3" opacity="0.6"/>
